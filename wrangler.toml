name = "moodle"
main = "src/worker.ts"
compatibility_date = "2026-09-23"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true
minify = true

[vars]
PUBLIC_URL = "https://moodle.yusoofsh.workers.dev"
MOODLE_MCP_MAX_FILE_MB = "2"

[[durable_objects.bindings]]
name = "MOODLE"
class_name = "Moodle"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Moodle"]
