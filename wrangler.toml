name = "moodle"
main = "src/worker.ts"
compatibility_date = "2026-09-23"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true
minify = true

[vars]
PUBLIC_URL = "https://moodle.yusoofsh.id"
MOODLE_MCP_MAX_FILE_MB = "2"

# Internal binding/class identifiers must match src/worker.ts. The public Worker
# name above is independent of these persistent Durable Object identifiers.
[[durable_objects.bindings]]
name = "MOODLE_MCP"
class_name = "MoodleMcp"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MoodleMcp"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
