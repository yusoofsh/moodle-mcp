name = "moodle-mcp"
main = "src/worker.ts"
compatibility_date = "2026-09-23"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Replace the example origin and KV id before deployment. Never store tokens here.
[vars]
PUBLIC_URL = "https://moodle-mcp.example.com"
GITHUB_ALLOWED_USER_ID = "18055365"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "00000000000000000000000000000000"
