name: Verify student coverage development
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: coverage-development
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/feat/sibermu-api-coverage'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Recover authored source checkpoint once (no university data or secrets)
        shell: bash
        run: |
          set -euo pipefail
          if test ! -f src/documents/extract.ts; then
            mkdir -p /tmp/source-checkpoint src/documents tests/fixtures
            curl --fail --location --max-time 180 'https://backend.composio.dev/api/v3/sl/EKZ6AG8uk4' -o /tmp/source-checkpoint.tgz
            sha256sum /tmp/source-checkpoint.tgz
            tar -xzf /tmp/source-checkpoint.tgz -C /tmp/source-checkpoint \
              moodle-coverage.77GV9I/src/documents \
              moodle-coverage.77GV9I/src/file-access.ts \
              moodle-coverage.77GV9I/src/tools/download.ts \
              moodle-coverage.77GV9I/tests/document-reading.test.ts \
              moodle-coverage.77GV9I/tests/fixtures/document-fixtures.ts
            cp /tmp/source-checkpoint/moodle-coverage.77GV9I/src/documents/*.ts src/documents/
            cp /tmp/source-checkpoint/moodle-coverage.77GV9I/src/file-access.ts src/
            cp /tmp/source-checkpoint/moodle-coverage.77GV9I/src/tools/download.ts src/tools/
            cp /tmp/source-checkpoint/moodle-coverage.77GV9I/tests/document-reading.test.ts tests/
            cp /tmp/source-checkpoint/moodle-coverage.77GV9I/tests/fixtures/document-fixtures.ts tests/fixtures/
            node --input-type=module <<'JS'
          import fs from 'node:fs';
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.version='0.10.0';pkg.dependencies.unpdf='1.8.1';pkg.dependencies.fflate='0.8.3';
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          const manifest=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          manifest.version='0.10.0';manifest.tools.push({name:'moodle_read_document',description:'Extract bounded PDF DOCX PPTX and text content from an authorized file ID'});
          fs.writeFileSync('manifest.json',JSON.stringify(manifest,null,2)+'\n');
          for(const name of ['src/tool-policy.ts','src/server.ts','src/app-core.ts']){
            let s=fs.readFileSync(name,'utf8').replaceAll('0.9.2','0.10.0');
            if(name==='src/tool-policy.ts')s=s.replace('  moodle_download_file:', '  moodle_read_document: ["core_course_get_contents"],\n  moodle_download_file:');
            fs.writeFileSync(name,s);
          }
          const download='src/tools/download.ts';fs.writeFileSync(download,'import { Buffer } from "node:buffer";\n'+fs.readFileSync(download,'utf8'));
          JS
          fi
      - name: Resolve pinned dependencies and formatting on development branch
        run: |
          bun install --ignore-scripts
          bun run format
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock manifest.json package.json src tests scripts README.md SECURITY.md docs
          if ! git diff --cached --quiet; then
            git commit -m 'chore: persist authored document sources and dependency lock'
            git push origin HEAD:feat/sibermu-api-coverage
          fi
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check && bun run test && bun run build
      - run: bun run workers:build
      - run: bunx --no-install playwright install --with-deps chromium firefox
      - run: bun run workers:test:browser
      - run: bun run workers:test:sso
      - run: bun audit
