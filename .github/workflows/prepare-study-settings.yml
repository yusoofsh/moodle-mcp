name: Prepare study settings
on:
  push:
    branches: [feat/persistent-study-settings-20261004]
    paths: [.github/workflows/prepare-study-settings.yml, scripts/prepare-study-settings.mjs]
permissions:
  contents: write
concurrency:
  group: prepare-study-settings
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'yusoofsh/moodle-mcp' && github.ref == 'refs/heads/feat/persistent-study-settings-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Apply the reviewed owner-bound integration and remove preparation code
        run: |
          node scripts/prepare-study-settings.mjs
          git rm scripts/prepare-study-settings.mjs .github/workflows/prepare-study-settings.yml
          bunx --no-install prettier --write src/workflows/settings.ts src/workflows/study-plan.ts src/register-tools.ts src/app-core.ts tests/study-settings.test.ts
      - name: Verify all source tests and the Worker artifact
        run: bun run check && bun run test && bun run build && bun run workers:build
      - name: Commit the tested source changes on this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/workflows/settings.ts src/workflows/study-plan.ts src/register-tools.ts src/app-core.ts tests/study-settings.test.ts
          git diff --cached --check
          git commit -m 'Wire persistent study preferences after source and Worker checks'
          git push origin HEAD:refs/heads/feat/persistent-study-settings-20261004
