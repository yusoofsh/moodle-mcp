name: Prepare Study Hub
on:
  push:
    branches: [feat/study-hub-extension-20261004]
    paths: [.github/workflows/prepare-study-hub.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'yusoofsh/moodle-mcp' && github.ref == 'refs/heads/feat/study-hub-extension-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Apply the reviewed integration edits
        run: |
          node scripts/prepare-study-hub.mjs
          git rm .github/workflows/prepare-study-hub.yml scripts/prepare-study-hub.mjs
          bunx --no-install prettier --write src/ui src/resources/index.ts src/tools/content.ts tests/study-hub.test.ts tests/tool-policy.test.ts
      - name: Verify the unchanged tool contracts and Worker build
        run: bun run check && bun run test && bun run build && bun run workers:build
      - name: Commit the validated source edits on this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui src/resources/index.ts src/tools/content.ts tests/study-hub.test.ts tests/tool-policy.test.ts
          git diff --cached --check
          git commit -m 'Connect and validate the Study Hub without changing read permissions'
          git push origin HEAD:refs/heads/feat/study-hub-extension-20261004
