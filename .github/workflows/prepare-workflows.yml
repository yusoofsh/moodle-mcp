name: Prepare workflow runtime
on:
  push:
    branches: [feat/workflow-runtime-20261004]
    paths: [.github/workflows/prepare-workflows.yml, scripts/prepare-workflows.mjs]
permissions:
  contents: write
concurrency:
  group: prepare-workflow-runtime
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'yusoofsh/moodle-mcp' && github.ref == 'refs/heads/feat/workflow-runtime-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Apply reviewed integrations and remove temporary preparation files
        run: |
          node scripts/prepare-workflows.mjs
          bun scripts/export-workflow-skills.ts
          bun scripts/refresh-tool-manifest.ts
          git rm .github/workflows/prepare-workflows.yml scripts/prepare-workflows.mjs
          bunx --no-install prettier --write src/workflows src/register-tools.ts src/resources/index.ts src/tool-policy.ts src/ui/bridge.ts src/ui/study-hub.ts src/ui/deep-link.ts tests/workflow-foundation.test.ts tests/workflow-wire.test.ts tests/study-plan.test.ts tests/deep-link.test.ts tests/discovery.test.ts scripts/export-workflow-skills.ts skills
      - name: Verify source, permissions, full tests and Worker artifact
        run: bun run check && bun run test && bun run build && bun run workers:build
      - name: Commit validated source only to this feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/workflows src/register-tools.ts src/resources/index.ts src/tool-policy.ts src/ui/bridge.ts src/ui/study-hub.ts src/ui/deep-link.ts tests/workflow-foundation.test.ts tests/workflow-wire.test.ts tests/study-plan.test.ts tests/deep-link.test.ts tests/discovery.test.ts scripts/export-workflow-skills.ts skills manifest.json
          git diff --cached --check
          git commit -m 'Validate guided study planning, resource manifests and workflow skills'
          git push origin HEAD:refs/heads/feat/workflow-runtime-20261004
