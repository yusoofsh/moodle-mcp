name: Prepare Worker settings acceptance
on:
  push:
    branches: [feat/persistent-study-settings-20261004]
    paths: [.github/workflows/repair-settings-worker-test.yml, scripts/repair-settings-worker-test.mjs]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'yusoofsh/moodle-mcp' && github.ref == 'refs/heads/feat/persistent-study-settings-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Retain existing checks and add the exact settings round trip
        run: |
          node scripts/repair-settings-worker-test.mjs
          git rm scripts/repair-settings-worker-test.mjs .github/workflows/repair-settings-worker-test.yml
          bunx --no-install prettier --write scripts/test-workers.mjs
      - name: Verify the real Worker without using a live account
        run: bun run build && bun run workers:build && node scripts/test-workers.mjs
      - name: Commit the validated acceptance test only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test-workers.mjs
          git diff --cached --check
          git commit -m 'Verify local preference persistence in the actual Worker runtime'
          git push origin HEAD:refs/heads/feat/persistent-study-settings-20261004
